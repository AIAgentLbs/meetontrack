name: Windows packaged candidate acceptance
on:
  workflow_dispatch:
  push:
    branches: [feat/windows-installer]
    paths: ['.github/workflows/windows-candidate.yml', 'scripts/check_windows_candidate.ps1']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 20
    # Draft assets are not visible to a contents:read token. Restrict the
    # collaborator permission to this candidate job; no publishing step runs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download draft release candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release download windows-v0.1.17 --repo $env:GITHUB_REPOSITORY --pattern 'meeting-copilot-windows-v0.1.17-x64.zip' --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
      - name: Exact packaged installation and regressions
        shell: pwsh
        run: |
          ./scripts/check_windows_candidate.ps1 -PackagePath ./candidate/meeting-copilot-windows-v0.1.17-x64.zip -ExpectedSha256 686897a8e788cf18ea876cc095e8751ad5a2955f457b9a5cf6bb2656d5527e93 -Installer ./scripts/windows/install.ps1
