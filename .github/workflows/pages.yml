name: Pages
on:
  push:
    branches: [main]
    paths: ["docs/**", "install.sh", "INSTALL.md", "scripts/test_installer.py", "scripts/check-project-site.cjs", "scripts/stage-site-screenshots.cjs", "scripts/stage-comparison-logos.cjs", "scripts/test-site-launch.cjs", "scripts/build-comparisons.cjs", "scripts/test-comparisons.cjs", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer and site
        run: |
          bash -n install.sh
          python3 scripts/test_installer.py
          node --check docs/site.js
          node --check docs/analytics.js
          node scripts/build-comparisons.cjs --check
          node scripts/test-comparisons.cjs
      - name: Stage only public site files
        run: |
          mkdir -p _site/ru
          cp docs/index.html docs/styles.css docs/site.js _site/
          cp docs/ru/index.html _site/ru/
          cp install.sh _site/install.sh
          cp docs/install.ps1 _site/install.ps1
          cp docs/analytics.js docs/analytics-config.json docs/robots.txt docs/sitemap.xml docs/llms.txt docs/favicon.svg docs/privacy.html _site/
          mkdir -p _site/compare
          cp docs/compare/index.html _site/compare/
          for page in docs/compare/*/index.html; do
            directory="$(basename "$(dirname "$page")")"
            mkdir -p "_site/compare/$directory"
            cp "$page" "_site/compare/$directory/index.html"
          done
      - name: Stage verified screenshots without adding media to Git
        run: node scripts/stage-site-screenshots.cjs _site/media
      - name: Stage verified product logos without adding media to Git
        run: node scripts/stage-comparison-logos.cjs _site/media/logos
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
